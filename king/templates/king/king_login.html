{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Owner Access | {{ BRAND_SHORT_NAME }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --obsidian:     #070509;
            --deep:         #0e0b14;
            --vault:        #15111f;
            --chamber:      #1c1728;
            --rim:          #2a2238;
            --gold-bright:  #e8c96a;
            --gold:         #c9a84c;
            --gold-dim:     #8a6f2e;
            --gold-dust:    rgba(201, 168, 76, 0.12);
            --gold-glow:    rgba(201, 168, 76, 0.25);
            --cream:        #f5ede0;
            --cream-muted:  #a89880;
            --cream-hint:   #5c4f40;
            --red-soft:     #e07070;
            --red-bg:       rgba(224, 112, 112, 0.08);
        }

        /* ─── BODY / STAGE ─── */
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--obsidian);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── RADIAL FOG LAYERS ─── */
        .fog {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .fog::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 60% at 50% 0%,   rgba(201,168,76,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 20% 80%,  rgba(100,60,180,0.06) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 80% 90%,  rgba(201,168,76,0.04) 0%, transparent 55%);
        }

        /* ─── STAR FIELD ─── */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: var(--gold-bright);
            animation: starPulse var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
        }

        @keyframes starPulse {
            0%, 100% { opacity: var(--op-min, 0.1); transform: scale(1); }
            50%       { opacity: var(--op-max, 0.5); transform: scale(1.4); }
        }

        /* ─── WRAP / CARD ─── */
        .wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            animation: riseIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(28px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }

        /* ─── CROWN SEAL ─── */
        .seal {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }

        .crown-ring {
            position: relative;
            width: 96px;
            height: 96px;
            margin-bottom: 18px;
        }

        /* Outer rotating ring */
        .crown-ring::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: var(--gold);
            border-right-color: var(--gold-dim);
            animation: spinRing 6s linear infinite;
        }

        /* Inner stationary ring */
        .crown-ring::after {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 1px dashed rgba(201,168,76,0.2);
            animation: spinRing 18s linear infinite reverse;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .crown-disc {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, var(--chamber), var(--deep));
            border: 1px solid var(--rim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow:
                0 0 0 1px rgba(201,168,76,0.15),
                0 0 32px rgba(201,168,76,0.12),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: crownFloat 5s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes crownFloat {
            0%, 100% { transform: translateY(0); box-shadow: 0 0 0 1px rgba(201,168,76,0.15), 0 0 32px rgba(201,168,76,0.12), inset 0 1px 0 rgba(255,255,255,0.05); }
            50%       { transform: translateY(-8px); box-shadow: 0 0 0 1px rgba(201,168,76,0.25), 0 0 56px rgba(201,168,76,0.22), 0 18px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05); }
        }

        /* Gold shimmer sweep on crown disc */
        .crown-disc::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, transparent 30%, rgba(201,168,76,0.12) 50%, transparent 70%);
            animation: shimmerSweep 4s ease-in-out infinite;
        }

        @keyframes shimmerSweep {
            0%   { transform: rotate(0deg); opacity: 0; }
            40%  { opacity: 1; }
            100% { transform: rotate(360deg); opacity: 0; }
        }

        .seal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--gold-bright);
            letter-spacing: 0.04em;
            text-align: center;
            line-height: 1;
        }

        .seal-subtitle {
            font-size: 11px;
            font-weight: 400;
            color: var(--cream-muted);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 6px;
            text-align: center;
        }

        /* thin gold divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            width: 180px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
        }

        .divider-diamond {
            width: 4px;
            height: 4px;
            background: var(--gold);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* ─── CARD ─── */
        .card {
            background: var(--vault);
            border: 1px solid var(--rim);
            border-radius: 20px;
            padding: 32px 30px 36px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 40px 80px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.03),
                inset 0 1px 0 rgba(255,255,255,0.04);
        }

        /* Top gold accent bar */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 40px; right: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        /* Ambient inner glow */
        .card::after {
            content: '';
            position: absolute;
            top: -60px; left: 50%;
            transform: translateX(-50%);
            width: 200px; height: 120px;
            background: radial-gradient(ellipse, rgba(201,168,76,0.06), transparent 70%);
            pointer-events: none;
        }

        /* ─── ALERT ─── */
        .alert {
            background: var(--red-bg);
            border: 1px solid rgba(224,112,112,0.25);
            color: var(--red-soft);
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert svg { flex-shrink: 0; width: 14px; height: 14px; }

        /* ─── FORM ─── */
        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: var(--cream-muted);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cream-hint);
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-icon svg { width: 14px; height: 14px; }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: var(--chamber);
            border: 1px solid var(--rim);
            border-radius: 10px;
            padding: 12px 14px 12px 40px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: var(--cream);
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--cream-hint);
            font-weight: 300;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            background: var(--deep);
            border-color: var(--gold-dim);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.1), 0 0 16px rgba(201,168,76,0.08);
        }

        input[type="text"]:focus + .input-icon,
        input[type="password"]:focus + .input-icon {
            color: var(--gold-dim);
        }

        /* Focus icon sibling trick — icon is BEFORE input in DOM */
        .input-wrap:focus-within .input-icon {
            color: var(--gold);
        }

        /* ─── SUBMIT BUTTON ─── */
        .btn {
            width: 100%;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #b8922a 0%, #d4a93e 40%, #c9a84c 60%, #9a7520 100%);
            color: #1a1000;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            box-shadow: 0 4px 20px rgba(201,168,76,0.25), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        /* Shine sweep */
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            transform: skewX(-15deg);
            animation: btnShine 3.5s ease-in-out infinite 1.2s;
        }

        @keyframes btnShine {
            0%   { left: -75%; opacity: 1; }
            40%  { left: 130%; opacity: 1; }
            100% { left: 130%; opacity: 0; }
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(201,168,76,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
        }

        .btn:active {
            transform: translateY(0);
            filter: brightness(0.95);
        }

        /* ─── FOOTER ─── */
        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 22px;
            font-size: 10px;
            font-weight: 400;
            color: var(--cream-hint);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .footer-diamond {
            width: 3px; height: 3px;
            background: var(--gold-dim);
            transform: rotate(45deg);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<!-- Background fog layers -->
<div class="fog"></div>

<!-- Star field (generated by JS) -->
<div class="stars" id="stars"></div>

<div class="wrap">

    <!-- Crown Seal (outside card, floats above) -->
    <div class="seal">
        <div class="crown-ring">
            <div class="crown-disc">👑</div>
        </div>

        <div class="seal-title">Owner Console</div>
        <div class="seal-subtitle">{{ BRAND_SHORT_NAME }} &nbsp;·&nbsp; Restricted Access</div>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-diamond"></div>
            <div class="divider-line"></div>
        </div>
    </div>

    <!-- Login Card -->
    <div class="card">

        {% if messages %}
            {% for message in messages %}
            <div class="alert">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="POST" autocomplete="off">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input type="text" name="username" placeholder="Enter owner username" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn">Access Owner Console</button>
        </form>

        <div class="footer">
            <span>Encrypted</span>
            <span class="footer-diamond"></span>
            <span>Authorized Personnel Only</span>
        </div>

    </div>
</div>

<script>
    // ── STAR FIELD GENERATOR ──
    const container = document.getElementById('stars');
    const STAR_COUNT = 60;

    for (let i = 0; i < STAR_COUNT; i++) {
        const s = document.createElement('div');
        s.className = 'star';

        const size  = Math.random() * 2 + 0.8;
        const x     = Math.random() * 100;
        const y     = Math.random() * 100;
        const dur   = (Math.random() * 4 + 2).toFixed(1) + 's';
        const delay = (Math.random() * 6).toFixed(1) + 's';
        const opMin = (Math.random() * 0.08 + 0.04).toFixed(2);
        const opMax = (Math.random() * 0.4  + 0.2).toFixed(2);

        s.style.cssText = `
            width:${size}px; height:${size}px;
            left:${x}%; top:${y}%;
            --dur:${dur}; --delay:${delay};
            --op-min:${opMin}; --op-max:${opMax};
            animation-delay:${delay};
        `;
        container.appendChild(s);
    }
</script>
<script src="{% static 'js/theme.js' %}"></script>
</body>
</html>
