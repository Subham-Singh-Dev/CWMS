{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assign Leave | {{ BRAND_SHORT_NAME }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Searchable Dropdown CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <style>
        /* DASHBOARD CSS */
        :root {
            --neutral-50: #f8fafc; --neutral-100: #f1f5f9; --neutral-200: #e2e8f0; --neutral-300: #cbd5e1;
            --neutral-400: #94a3b8; --neutral-500: #64748b; --neutral-600: #475569; --neutral-700: #334155;
            --neutral-800: #1e293b; --neutral-900: #0f172a;
            --danger-50: #fef2f2; --danger-500: #ef4444; --danger-600: #dc2626; --danger-700: #b91c1c;
            --success-50: #f0fdf4; --success-500: #10b981; --success-600: #059669;
            --primary-50: #eff6ff; --primary-500: #3b82f6; --primary-600: #2563eb; --primary-700: #1d4ed8;
            --warning-50: #fffbeb; --warning-500: #f59e0b; --warning-600: #d97706;
            --purple-500: #8b5cf6; --purple-600: #7c3aed;

            --bg-body: var(--neutral-50); --bg-card: #ffffff; --bg-secondary: var(--neutral-100);
            --text-primary: var(--neutral-900); --text-secondary: var(--neutral-600); --text-muted: #6b7294;
            --border-subtle: var(--neutral-200); --border-strong: var(--neutral-300);
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-body: #0a0d14; --bg-card: #111520; --bg-secondary: #0f1117;
            --text-primary: #eef0f8; --text-secondary: #a8b0c8; --text-muted: #6b7294;
            --border-subtle: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.13);
            --shadow-sm: 0 1px 3px 0 rgba(0,0,0,.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-primary); padding: 20px; transition: all 0.2s ease; }
        .container { max-width: 800px; margin: 0 auto; }

        /* Header */
        .header { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 20px 28px; margin-bottom: 28px; box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden; }
        .header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--primary-500), var(--purple-500)); }
        .brand { font-weight: 900; font-size: 20px; letter-spacing: -0.5px; background: linear-gradient(135deg, var(--primary-600), var(--purple-600)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-controls { display: flex; align-items: center; gap: 12px; }
        .btn-back { padding: 8px 16px; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.2s ease; }
        .btn-back:hover { background: var(--border-subtle); }

        /* Form Specific Styles */
        .form-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 32px; box-shadow: var(--shadow-sm); animation: slideUp 0.5s ease-out both; }
        .section-title { font-size: 20px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
        .section-title::before { content: ''; width: 4px; height: 24px; background: linear-gradient(180deg, var(--primary-500), var(--purple-500)); border-radius: 2px; }
        
        form p { margin-bottom: 20px; }
        form label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 12px 16px; background: var(--bg-body); border: 1px solid var(--border-strong); border-radius: 10px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 14px; transition: all 0.2s ease; }
        .form-control:focus { outline: none; border-color: var(--primary-500); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        [data-theme="dark"] .form-control { background: rgba(0,0,0,0.2); }
        
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary-600), var(--primary-700)); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); }

        .messages { list-style: none; margin-bottom: 20px; }
        .messages li { padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
        .messages li.success { background: var(--success-50); color: var(--success-700); border: 1px solid var(--success-500); }
        .messages li.error { background: var(--danger-50); color: var(--danger-700); border: 1px solid var(--danger-500); }

        /* Select2 Custom Theme overrides */
        .select2-container .select2-selection--single {
            height: 47px;
            padding: 8px;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            background-color: var(--bg-body);
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow { height: 45px; }
        
        [data-theme="dark"] .select2-container .select2-selection--single { background-color: rgba(0,0,0,0.2); border-color: var(--border-strong); }
        [data-theme="dark"] .select2-dropdown { background-color: var(--bg-card); border: 1px solid var(--border-strong); }
        [data-theme="dark"] .select2-search input { background-color: rgba(0,0,0,0.2); color: var(--text-primary); border: 1px solid var(--border-strong); }
        [data-theme="dark"] .select2-results__option { color: var(--text-secondary); }
        [data-theme="dark"] .select2-results__option--highlighted[aria-selected] { background-color: var(--primary-600); color: white; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="container">
    
    <div class="header">
        <div class="brand">🏖️ Leave Management</div>
        <div class="header-controls">
            <a href="{% url 'manager_dashboard' %}" class="btn-back">← Back to Dashboard</a>
        </div>
    </div>

    <div class="form-card">
        <div class="section-title">Assign New Leave</div>
        
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Submit & Assign Leave</button>
        </form>
    </div>
</div>

<!-- SCRIPTS -->
<script src="{% static 'js/theme.js' %}"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    // 1. Initialize Searchable Dropdown
    $(document).ready(function() {
        $('#id_employee').select2({
            placeholder: "Search by typing a name...",
            allowClear: true,
            width: '100%'
        });
    });

    // 2. Date Calculation Script
    document.addEventListener("DOMContentLoaded", function() {
        const fromInput = document.getElementById("id_from_date");
        const toInput = document.getElementById("id_to_date");
        const daysInput = document.getElementById("id_total_days");

        function calculateDays() {
            if (fromInput.value && toInput.value) {
                const start = new Date(fromInput.value);
                const end = new Date(toInput.value);
                const timeDiff = end.getTime() - start.getTime();
                const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24)) + 1; 
                
                if (daysDiff > 0) {
                    daysInput.value = daysDiff;
                } else {
                    daysInput.value = 0;
                }
            }
        }
        fromInput.addEventListener("change", calculateDays);
        toInput.addEventListener("change", calculateDays);
    });
</script>

</body>
</html>
